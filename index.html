<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>아이패드용 애니메이션 웹 에디터 (완성본 v5)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
<style>
    body { margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; background: #2c2c2c; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
    .toolbar { background: #1e1e1e; padding: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #444; z-index: 10; }
    .toolbar button, .toolbar select, .toolbar input[type="color"] { padding: 8px 12px; border: none; border-radius: 4px; background: #3a3a3a; color: white; cursor: pointer; font-size: 14px; }
    .toolbar button:hover { background: #555; }
    .toolbar button.active { background: #4CAF50; }
    .toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }

    .color-swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #555; cursor: pointer; display: inline-block; transition: transform 0.1s; }
    .color-swatch:hover { transform: scale(1.1); }
    .color-swatch.active { border-color: #fff; box-shadow: 0 0 5px rgba(255,255,255,0.8); }

    .workspace { display: flex; flex: 1; overflow: hidden; position: relative; }

    .layer-panel { width: 220px; background: #1e1e1e; border-right: 1px solid #444; display: flex; flex-direction: column; }
    .layer-header { padding: 10px; border-bottom: 1px solid #333; font-weight: bold; background: #2a2a2a; display: flex; justify-content: space-between; align-items: center; }
    .layer-list { flex: 1; overflow-y: auto; padding: 5px; }
    .layer-item { display: flex; align-items: center; padding: 8px; margin-bottom: 5px; background: #333; border-radius: 4px; cursor: pointer; }
    .layer-item.active { border: 2px solid #4CAF50; background: #444; }
    .layer-item input[type="text"] { width: 70px; background: transparent; border: none; color: white; outline: none; margin-left: 5px; }
    .layer-mini-btn { background: #555; border: none; color: white; border-radius: 4px; padding: 3px 6px; font-size: 12px; cursor: pointer; margin-left: 4px; }
    .layer-mini-btn.del { margin-left: auto; }
    .layer-mini-btn.del:hover { background: #e53935; }

    .canvas-container { flex: 1; position: relative; overflow: hidden; background: #1a1a1a; display: flex; justify-content: center; align-items: center; }
    .canvas-wrapper { position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.5); transform-origin: center center; }
    .canvas-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffffff; z-index: 0; pointer-events: none; }

    canvas { position: absolute; top: 0; left: 0; }
    #layers-container { position: absolute; top: 0; left: 0; z-index: 1; }
    #onion-canvas { z-index: 2; pointer-events: none; opacity: 0.5; }
    #interaction-canvas { z-index: 3; touch-action: none; cursor: crosshair; }

    #eraser-cursor { position: absolute; top: 0; left: 0; border: 2px solid #ff5252; background: rgba(255,82,82,0.15); border-radius: 50%; pointer-events: none; z-index: 20; display: none; transform: translate(-50%, -50%); }

    .timeline { background: #1e1e1e; padding: 10px; border-top: 1px solid #444; display: flex; align-items: center; gap: 10px; overflow-x: auto; height: 80px; flex-shrink: 0; }
    .frame-thumb { width: 60px; height: 45px; background: white; border: 2px solid #555; border-radius: 4px; cursor: pointer; flex-shrink: 0; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    .frame-thumb.active { border-color: #4CAF50; }
    .frame-thumb img { max-width: 100%; max-height: 100%; pointer-events: none; }
    .frame-number { position: absolute; top: 2px; left: 2px; background: rgba(0,0,0,0.7); color: white; font-size: 10px; padding: 2px 4px; border-radius: 2px; }
    .frame-del-btn { position: absolute; top: 2px; right: 2px; background: #e53935; color: white; border: none; border-radius: 50%; width: 16px; height: 16px; font-size: 10px; line-height: 16px; text-align: center; cursor: pointer; padding: 0; z-index: 5; }
    .frame-del-btn:hover { background: #ff5252; }

    .controls { display: flex; gap: 5px; align-items: center; }
</style>
</head>
<body>

<div class="toolbar">
    <button id="tool-brush" class="active">🖌 브러시</button>
    <select id="brush-type">
        <option value="pen">🖊 기본펜</option>
        <option value="pencil">✏️ 연필</option>
        <option value="marker">🖍 마커</option>
        <option value="highlighter">🟡 형광펜</option>
    </select>
    <button id="tool-eraser">🧹 지우개</button>
    <button id="tool-fill">🪣 채우기</button>
    <button id="tool-lasso">✂️ 올가미</button>

    <div style="width: 1px; height: 20px; background: #555; margin: 0 5px;"></div>

    <span style="font-size: 13px;">크기</span>
    <input type="range" id="size-picker" min="1" max="50" value="5" style="width: 60px;">
    <span id="size-val" style="width: 30px; font-size: 13px;">5px</span>

    <span style="font-size: 13px; margin-left: 5px;">💧투명도</span>
    <input type="range" id="alpha-picker" min="1" max="100" value="100" style="width: 60px;">
    <span id="alpha-val" style="width: 40px; font-size: 13px;">100%</span>

    <div style="width: 1px; height: 20px; background: #555; margin: 0 5px;"></div>

    <input type="color" id="color-picker" value="#000000" style="padding: 0; width: 36px; height: 36px;">
    <div id="color-history" style="display: flex; gap: 5px; align-items: center; margin-left: 5px;"></div>

    <div style="width: 1px; height: 20px; background: #555; margin: 0 5px;"></div>

    <button id="btn-copy" disabled>복사</button>
    <button id="btn-paste" disabled>붙여넣기</button>
    <button id="btn-scale-up" disabled title="확대">🔍+</button>
    <button id="btn-scale-down" disabled title="축소">🔍-</button>
    <span style="font-size:11px; color:#aaa; margin: 0 4px;">회전: 선택 위 ⤾ 손잡이를 드래그</span>
    <button id="btn-flip-h" disabled title="좌우 반전">⬌</button>
    <button id="btn-flip-v" disabled title="상하 반전">⬍</button>
    <button id="btn-delete" disabled style="color: #ff8a8a;">🗑️ 삭제</button>

    <div style="width: 1px; height: 20px; background: #555; margin: 0 5px;"></div>

    <button id="btn-undo">↩️ 취소</button>
    <button id="btn-redo">↪️ 재실행</button>
    <button id="btn-zoom-in">🔍+</button>
    <button id="btn-zoom-out">🔍-</button>
    <button id="btn-zoom-reset">100%</button>

    <div style="width: 1px; height: 20px; background: #555; margin: 0 5px;"></div>

    <label style="font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px;">
        <input type="checkbox" id="chk-onion" checked> 🧅 어니언스킨
    </label>
</div>

<div class="workspace">
    <div class="layer-panel">
        <div class="layer-header">
            <span>레이어</span>
            <button id="btn-add-layer" style="padding: 2px 8px;">+</button>
        </div>
        <div class="layer-list" id="layer-list"></div>
    </div>

    <div class="canvas-container" id="canvas-container">
        <div class="canvas-wrapper" id="canvas-wrapper">
            <div class="canvas-bg"></div>
            <div id="layers-container"></div>
            <canvas id="onion-canvas"></canvas>
            <canvas id="interaction-canvas"></canvas>
            <div id="eraser-cursor"></div>
        </div>
    </div>
</div>

<div class="timeline" id="timeline">
    <div class="controls">
        <button id="btn-add-frame">➕ 새 프레임</button>
        <button id="btn-dup-frame">📄 전체 복제</button>
        <button id="btn-clear-frame" style="color:#000;">🧹 화면 지우기</button>
        <button id="btn-play">▶️ 재생</button>
        <button id="btn-stop" style="display:none;">⏹ 정지</button>
        <button id="btn-save-gif" style="background:#E91E63; font-weight:bold;">🎬 GIF 저장</button>
        <button id="btn-save-project" style="background:#3F51B5; color:#fff; font-weight:bold;">💾 프로젝트 저장</button>
        <button id="btn-load-project" style="background:#009688; color:#fff; font-weight:bold;">📂 프로젝트 열기</button>
        <input type="file" id="project-file-input" accept="application/json,.json" style="display:none;">
    </div>
    <div id="frame-thumbnails" style="display: flex; gap: 5px;"></div>
</div>

<script>
    const CANVAS_W = 1280;
    const CANVAS_H = 720;
    const FPS = 8;
    const FRAME_DUR = 1000 / FPS;

    // 붓 종류별 특성 정의
    const BRUSH_PROFILES = {
        pen:         { sizeMul: 1.0, alphaMul: 1.0,  composite: 'source-over', cap: 'round', jitter: 0 },
        pencil:      { sizeMul: 0.65, alphaMul: 0.65, composite: 'source-over', cap: 'round', jitter: 0.6 },
        marker:      { sizeMul: 1.8, alphaMul: 0.9,  composite: 'source-over', cap: 'square', jitter: 0 },
        highlighter: { sizeMul: 2.6, alphaMul: 0.35, composite: 'multiply',    cap: 'square', jitter: 0 }
    };
    let currentBrushType = 'pen';

    let currentMode = 'brush';
    let currentColor = '#000000';
    let currentSize = 5;
    let currentAlpha = 1.0;
    let recentColors = ['#000000', '#FF5252', '#4CAF50', '#2196F3', '#FFEB3B', '#FFFFFF'];

    let isDrawing = false;
    let lastX = 0, lastY = 0;

    let frames = [];
    let currentFrameIdx = 0;
    let globalLayers = [ { id: 'layer-0', name: '배경 스케치', visible: true }, { id: 'layer-1', name: '캐릭터', visible: true } ];
    let currentLayerIdx = 1;

    let interactionCvs, iCtx;
    let onionCvs, oCtx;
    let layersContainer, canvasWrapper, layerListDiv, frameThumbnailsDiv;
    let eraserCursorEl;

    let zoomLevel = 1.0;
    let baseFitScale = 1.0; // 화면 크기에 맞춰 자동 계산되는 기본 맞춤 배율
    let isPanning = false;
    let panStartX, panStartY, translateX = 0, translateY = 0;

    let undoStack = [], redoStack = [];
    const MAX_HISTORY = 20;

    let lassoPoints = [];
    let isLassoSelecting = false, hasSelection = false;
    let selectionCanvas = null;
    let selectionX = 0, selectionY = 0;
    let selectionAngle = 0; // 현재 미리보기 회전 각도(라디안), 드래그 종료 시 픽셀에 구워넣고 0으로 리셋
    let isDraggingSelection = false, dragStartX, dragStartY;
    let clipboardCanvas = null;
    let lastCopyOriginX = 0, lastCopyOriginY = 0; // 복사 시점의 원본 좌상단 좌표(붙여넣기 오프셋 기준)
    let isRotatingSelection = false;
    let rotateStartCanvas = null, rotateCenterX = 0, rotateCenterY = 0, rotateStartMouseAngle = 0;
    const ROTATE_HANDLE_OFFSET = 36, ROTATE_HANDLE_RADIUS = 9;

    let isPlaying = false, playInterval;

    function init() {
        interactionCvs = document.getElementById('interaction-canvas');
        onionCvs = document.getElementById('onion-canvas');
        layersContainer = document.getElementById('layers-container');
        canvasWrapper = document.getElementById('canvas-wrapper');
        layerListDiv = document.getElementById('layer-list');
        frameThumbnailsDiv = document.getElementById('frame-thumbnails');
        eraserCursorEl = document.getElementById('eraser-cursor');

        interactionCvs.width = onionCvs.width = CANVAS_W;
        interactionCvs.height = onionCvs.height = CANVAS_H;
        iCtx = interactionCvs.getContext('2d'); oCtx = onionCvs.getContext('2d');
        canvasWrapper.style.width = CANVAS_W + 'px'; canvasWrapper.style.height = CANVAS_H + 'px';

        updateColorHistoryUI();
        fitToContainer();
        updateTransform(); addFrame(); updateLayerUI();
        bindUIEvents(); bindCanvasEvents();
        updateCursorStyle();

        // [수정 ①②] 화면 크기가 바뀔 때마다(아이패드 회전 포함) 캔버스를 다시 중앙에 맞춤
        window.addEventListener('resize', fitToContainer);
        window.addEventListener('orientationchange', () => setTimeout(fitToContainer, 300));

        window.addEventListener('keydown', e => {
            if(e.code === 'Space' && currentMode !== 'lasso') {
                isPanning = true; document.getElementById('canvas-container').style.cursor = 'grab';
            }
            if((e.code === 'Delete' || e.code === 'Backspace') && hasSelection) {
                e.preventDefault(); deleteSelection();
            }
            if((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') {
                e.preventDefault(); if(e.shiftKey) redo(); else undo();
            }
        });
        window.addEventListener('keyup', e => {
            if(e.code === 'Space') {
                isPanning = false; document.getElementById('canvas-container').style.cursor = 'default';
            }
        });
    }

    // [수정 ①②] 캔버스 컨테이너 크기에 맞춰 캔버스를 자동으로 축소/확대하고
    // translate를 0으로 리셋해서 항상 정중앙에 오도록 함.
    // 화면에 "보이는" 크기와 터치 좌표 계산 기준(getPointerPos의 rect)이 항상 일치하게 되어
    // 종이 영역 바깥까지 터치가 인식되는 문제도 함께 해결됨.
    function fitToContainer() {
        const container = document.getElementById('canvas-container');
        const availW = container.clientWidth - 20;
        const availH = container.clientHeight - 20;
        const scale = Math.min(availW / CANVAS_W, availH / CANVAS_H, 1);
        baseFitScale = scale > 0 ? scale : 1;
        zoomLevel = baseFitScale;
        translateX = 0; translateY = 0;
        updateTransform();
        updateEraserCursorSize();
    }

    function updateTransform() {
        canvasWrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${zoomLevel})`;
    }

    // ===== 커서 스타일 (지우개는 원형 가이드로 표시) =====
    function updateCursorStyle() {
        if (currentMode === 'eraser') {
            interactionCvs.style.cursor = 'none';
            eraserCursorEl.style.display = 'block';
            updateEraserCursorSize();
        } else {
            interactionCvs.style.cursor = (currentMode === 'fill') ? 'cell' : 'crosshair';
            eraserCursorEl.style.display = 'none';
        }
    }

    function updateEraserCursorSize() {
        // 실제 캔버스 픽셀 크기 * 화면 줌 배율 = 화면에 보이는 지우개 원 지름
        const displaySize = currentSize * zoomLevel;
        eraserCursorEl.style.width = displaySize + 'px';
        eraserCursorEl.style.height = displaySize + 'px';
    }

    function updateColorHistoryUI() {
        const container = document.getElementById('color-history'); container.innerHTML = '';
        recentColors.forEach(color => {
            const swatch = document.createElement('div');
            swatch.className = 'color-swatch' + (color.toUpperCase() === currentColor.toUpperCase() ? ' active' : '');
            swatch.style.backgroundColor = color;
            swatch.onclick = () => {
                currentColor = color; document.getElementById('color-picker').value = color; updateColorHistoryUI();
            };
            container.appendChild(swatch);
        });
    }

    function addColorToHistory(hex) {
        recentColors = recentColors.filter(c => c.toUpperCase() !== hex.toUpperCase());
        recentColors.unshift(hex);
        if(recentColors.length > 8) recentColors.pop();
        updateColorHistoryUI();
    }

    function hexToRgba(hex) {
        let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        return [r, g, b, 255];
    }

    function executeFloodFill(ctx, startX, startY, fillColor) {
        startX = Math.floor(startX); startY = Math.floor(startY);
        const imageData = ctx.getImageData(0, 0, CANVAS_W, CANVAS_H);
        const data = imageData.data;
        const startPos = (startY * CANVAS_W + startX) * 4;
        const startR = data[startPos], startG = data[startPos+1], startB = data[startPos+2], startA = data[startPos+3];

        const targetColor = hexToRgba(fillColor);

        if (startR === targetColor[0] && startG === targetColor[1] && startB === targetColor[2] && startA === 255) return;

        const overlayData = ctx.createImageData(CANVAS_W, CANVAS_H);
        const oData = overlayData.data;

        const matchColor = (pos) => {
            return data[pos] === startR && data[pos+1] === startG && data[pos+2] === startB && data[pos+3] === startA;
        };
        const setColor = (pos) => {
            oData[pos] = targetColor[0]; oData[pos+1] = targetColor[1]; oData[pos+2] = targetColor[2]; oData[pos+3] = 255;
            data[pos] = targetColor[0]; data[pos+1] = targetColor[1]; data[pos+2] = targetColor[2]; data[pos+3] = 255;
        };

        const pixelStack = [[startX, startY]];
        while (pixelStack.length) {
            const newPos = pixelStack.pop();
            const px = newPos[0]; let py = newPos[1];
            let pixelPos = (py * CANVAS_W + px) * 4;

            while (py >= 0 && matchColor(pixelPos)) { py--; pixelPos -= CANVAS_W * 4; }
            pixelPos += CANVAS_W * 4; py++;
            let reachLeft = false; let reachRight = false;

            while (py < CANVAS_H && matchColor(pixelPos)) {
                setColor(pixelPos);
                if (px > 0) {
                    if (matchColor(pixelPos - 4)) {
                        if (!reachLeft) { pixelStack.push([px - 1, py]); reachLeft = true; }
                    } else if (reachLeft) reachLeft = false;
                }
                if (px < CANVAS_W - 1) {
                    if (matchColor(pixelPos + 4)) {
                        if (!reachRight) { pixelStack.push([px + 1, py]); reachRight = true; }
                    } else if (reachRight) reachRight = false;
                }
                py++; pixelPos += CANVAS_W * 4;
            }
        }

        const tempCvs = document.createElement('canvas');
        tempCvs.width = CANVAS_W; tempCvs.height = CANVAS_H;
        tempCvs.getContext('2d').putImageData(overlayData, 0, 0);

        ctx.save();
        ctx.globalAlpha = currentAlpha;
        ctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(tempCvs, 0, 0);
        ctx.restore();
    }

    function getPointerPos(e) {
        const rect = interactionCvs.getBoundingClientRect();
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = (clientX - rect.left) * (CANVAS_W / rect.width);
        const y = (clientY - rect.top) * (CANVAS_H / rect.height);
        return { x, y };
    }

    function bindCanvasEvents() {
        const opts = { passive: false };
        interactionCvs.addEventListener('pointerdown', handleDown, opts);
        window.addEventListener('pointermove', handleMove, opts);
        window.addEventListener('pointerup', handleUp, opts);
        window.addEventListener('pointercancel', handleUp, opts);
        interactionCvs.addEventListener('pointermove', (e) => {
            if (currentMode === 'eraser') {
                const rect = interactionCvs.getBoundingClientRect();
                eraserCursorEl.style.left = (e.clientX - rect.left) + 'px';
                eraserCursorEl.style.top = (e.clientY - rect.top) + 'px';
            }
        });
        interactionCvs.addEventListener('pointerleave', () => { eraserCursorEl.style.display = 'none'; });
        interactionCvs.addEventListener('pointerenter', () => { if(currentMode === 'eraser') eraserCursorEl.style.display = 'block'; });
    }

    function handleDown(e) {
        if(isPlaying) return;
        if(e.button === 1 || isPanning) {
            isPanning = true; panStartX = e.clientX - translateX; panStartY = e.clientY - translateY; return;
        }
        const pos = getPointerPos(e); lastX = pos.x; lastY = pos.y;
        const targetCtx = frames[currentFrameIdx][currentLayerIdx].getContext('2d');

        if (currentMode === 'fill') {
            executeFloodFill(targetCtx, pos.x, pos.y, currentColor);
            updateWorkspace(); saveHistorySnapshot(); return;
        }

        if (currentMode === 'lasso') {
            if (hasSelection) {
                if (isPointOnRotateHandle(pos.x, pos.y)) {
                    const { cx, cy } = getSelectionCenter();
                    isRotatingSelection = true;
                    rotateCenterX = cx; rotateCenterY = cy;
                    rotateStartMouseAngle = Math.atan2(pos.y - cy, pos.x - cx);
                    rotateStartCanvas = selectionAngle; // 드래그 시작 시점의 각도
                } else if (pos.x >= selectionX && pos.x <= selectionX + selectionCanvas.width && pos.y >= selectionY && pos.y <= selectionY + selectionCanvas.height) {
                    isDraggingSelection = true; dragStartX = pos.x - selectionX; dragStartY = pos.y - selectionY;
                } else { finalizeSelection(); startLasso(pos.x, pos.y); }
            } else { startLasso(pos.x, pos.y); }
        } else {
            isDrawing = true; targetCtx.lineJoin = 'round'; drawPoint(targetCtx, e, pos.x, pos.y);
        }
    }

    function handleMove(e) {
        if (isPanning) { translateX = e.clientX - panStartX; translateY = e.clientY - panStartY; updateTransform(); return; }
        if (!isDrawing && !isLassoSelecting && !isDraggingSelection && !isRotatingSelection) return;
        e.preventDefault();
        const pos = getPointerPos(e);
        if (isRotatingSelection) {
            const curMouseAngle = Math.atan2(pos.y - rotateCenterY, pos.x - rotateCenterX);
            selectionAngle = rotateStartCanvas + (curMouseAngle - rotateStartMouseAngle);
            drawSelectionFrame();
        } else if (isLassoSelecting) {
            lassoPoints.push(pos); drawLassoGuide();
        } else if (isDraggingSelection) {
            selectionX = pos.x - dragStartX; selectionY = pos.y - dragStartY; drawSelectionFrame();
        } else if (isDrawing) {
            const targetCtx = frames[currentFrameIdx][currentLayerIdx].getContext('2d');
            drawLine(targetCtx, e, lastX, lastY, pos.x, pos.y); lastX = pos.x; lastY = pos.y;
            // [수정 ③] 그리는 동안에는 updateWorkspace()를 호출하지 않음.
            // 기존에는 손가락이 움직일 때마다 모든 프레임 썸네일을 toDataURL()로 재생성해서
            // 프레임이 늘어날수록(약 8개 이상) 아이패드가 멈추는 원인이었음.
            // 실제 그림은 이미 targetCtx(캔버스)에 바로 그려지므로 다시 그릴 필요가 없음.
        }
    }

    function handleUp(e) {
        if (isPanning && e.button !== 1) { if(e.button === 1) isPanning = false; }
        if (isRotatingSelection) { isRotatingSelection = false; bakeSelectionRotation(); drawSelectionFrame(); saveHistorySnapshot(); }
        else if (isLassoSelecting) { isLassoSelecting = false; finishLasso(); }
        else if (isDraggingSelection) { isDraggingSelection = false; }
        else if (isDrawing) {
            isDrawing = false;
            // [수정 ③] 펜을 뗀 순간에만 썸네일/타임라인을 1회 갱신.
            updateWorkspace();
            saveHistorySnapshot();
        }
    }

    function getPressureSetting(e) {
        let pressure = 1.0; if (e.pointerType === 'pen' && e.pressure !== undefined) pressure = e.pressure;
        let size = currentSize; if (e.pointerType === 'pen') size = currentSize * (pressure * 1.5 + 0.1);
        return size;
    }

    // 붓 종류에 맞춰 선/점 두께·투명도·합성모드·지터 적용
    function applyBrushProfile(ctx, baseSize) {
        const profile = BRUSH_PROFILES[currentBrushType] || BRUSH_PROFILES.pen;
        let size = baseSize * profile.sizeMul;
        if (profile.jitter > 0) {
            size += (Math.random() - 0.5) * profile.jitter * baseSize * 0.5;
            if (size < 0.5) size = 0.5;
        }
        ctx.lineWidth = size;
        ctx.lineCap = profile.cap;
        ctx.globalAlpha = currentAlpha * profile.alphaMul;
        ctx.globalCompositeOperation = profile.composite;
        return profile;
    }

    function drawPoint(ctx, e, x, y) {
        const baseSize = getPressureSetting(e);
        if (currentMode === 'eraser') {
            ctx.lineWidth = currentSize; ctx.lineCap = 'round';
            ctx.globalAlpha = 1.0; ctx.globalCompositeOperation = 'destination-out'; ctx.strokeStyle = 'rgba(0,0,0,1)';
        } else {
            applyBrushProfile(ctx, baseSize); ctx.strokeStyle = currentColor;
        }
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y); ctx.stroke();
    }

    function drawLine(ctx, e, x1, y1, x2, y2) {
        const baseSize = getPressureSetting(e);
        if (currentMode === 'eraser') {
            ctx.lineWidth = currentSize; ctx.lineCap = 'round';
            ctx.globalAlpha = 1.0; ctx.globalCompositeOperation = 'destination-out'; ctx.strokeStyle = 'rgba(0,0,0,1)';
        } else {
            applyBrushProfile(ctx, baseSize); ctx.strokeStyle = currentColor;
        }
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }

    function bindUIEvents() {
        const tools = ['brush', 'eraser', 'fill', 'lasso'];
        tools.forEach(tool => {
            document.getElementById(`tool-${tool}`).onclick = (e) => {
                if(tool !== 'lasso') finalizeSelection();
                currentMode = tool;
                document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                updateCursorStyle();
            };
        });

        document.getElementById('brush-type').onchange = (e) => { currentBrushType = e.target.value; };

        document.getElementById('color-picker').onchange = (e) => { currentColor = e.target.value; addColorToHistory(currentColor); };

        document.getElementById('size-picker').oninput = (e) => {
            currentSize = parseInt(e.target.value); document.getElementById('size-val').innerText = currentSize + 'px';
            updateEraserCursorSize();
        };

        document.getElementById('alpha-picker').oninput = (e) => {
            currentAlpha = parseInt(e.target.value) / 100;
            document.getElementById('alpha-val').innerText = e.target.value + '%';
        };

        document.getElementById('btn-copy').onclick = copySelection;
        document.getElementById('btn-paste').onclick = pasteSelection;
        document.getElementById('btn-scale-up').onclick = () => { scaleSelection(1.1); };
        document.getElementById('btn-scale-down').onclick = () => { scaleSelection(0.9); };
        document.getElementById('btn-flip-h').onclick = () => { flipSelection('h'); };
        document.getElementById('btn-flip-v').onclick = () => { flipSelection('v'); };
        document.getElementById('btn-delete').onclick = deleteSelection;

        document.getElementById('btn-undo').onclick = undo;
        document.getElementById('btn-redo').onclick = redo;
        document.getElementById('btn-zoom-in').onclick = () => { zoomLevel += 0.2; updateTransform(); updateEraserCursorSize(); };
        document.getElementById('btn-zoom-out').onclick = () => { zoomLevel = Math.max(0.2, zoomLevel - 0.2); updateTransform(); updateEraserCursorSize(); };
        document.getElementById('btn-zoom-reset').onclick = () => { fitToContainer(); };
        document.getElementById('chk-onion').onchange = updateWorkspace;
        document.getElementById('btn-add-layer').onclick = addLayer;
        document.getElementById('btn-add-frame').onclick = () => addFrame(false);
        document.getElementById('btn-dup-frame').onclick = () => addFrame(true);
        document.getElementById('btn-clear-frame').onclick = clearCurrentFrame;
        document.getElementById('btn-play').onclick = playAnim;
        document.getElementById('btn-stop').onclick = stopAnim;
        document.getElementById('btn-save-gif').onclick = saveGif;
        document.getElementById('btn-save-project').onclick = saveProject;
        document.getElementById('btn-load-project').onclick = () => {
            document.getElementById('project-file-input').click();
        };
        document.getElementById('project-file-input').onchange = handleProjectFileChange;
    }

    // ===== 화면 지우기 (확인창 없이 즉시 실행) =====
    function clearCurrentFrame() {
        if (frames.length === 0) return;
        finalizeSelection();
        frames[currentFrameIdx].forEach(cvs => {
            cvs.getContext('2d').clearRect(0, 0, CANVAS_W, CANVAS_H);
        });
        updateWorkspace();
        saveHistorySnapshot();
    }

    function startLasso(x, y) {
        isLassoSelecting = true; lassoPoints = [{x, y}]; iCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    }

    function drawLassoGuide() {
        iCtx.clearRect(0, 0, CANVAS_W, CANVAS_H); iCtx.beginPath(); iCtx.moveTo(lassoPoints[0].x, lassoPoints[0].y);
        for(let i=1; i<lassoPoints.length; i++) iCtx.lineTo(lassoPoints[i].x, lassoPoints[i].y);
        iCtx.strokeStyle = '#2196F3'; iCtx.lineWidth = 2; iCtx.setLineDash([5, 5]); iCtx.stroke(); iCtx.setLineDash([]);
    }

    function finishLasso() {
        if(lassoPoints.length < 3) { iCtx.clearRect(0, 0, CANVAS_W, CANVAS_H); return; }
        let minX = CANVAS_W, minY = CANVAS_H, maxX = 0, maxY = 0;
        lassoPoints.forEach(p => {
            if(p.x < minX) minX = p.x; if(p.x > maxX) maxX = p.x;
            if(p.y < minY) minY = p.y; if(p.y > maxY) maxY = p.y;
        });
        const w = maxX - minX; const h = maxY - minY;
        if(w <= 0 || h <= 0) { iCtx.clearRect(0, 0, CANVAS_W, CANVAS_H); return; }

        const targetCvs = frames[currentFrameIdx][currentLayerIdx];
        const tempCvs = document.createElement('canvas'); tempCvs.width = w; tempCvs.height = h;
        const tCtx = tempCvs.getContext('2d');

        tCtx.save(); tCtx.beginPath(); tCtx.moveTo(lassoPoints[0].x - minX, lassoPoints[0].y - minY);
        for(let i=1; i<lassoPoints.length; i++) tCtx.lineTo(lassoPoints[i].x - minX, lassoPoints[i].y - minY);
        tCtx.closePath(); tCtx.clip();
        tCtx.drawImage(targetCvs, minX, minY, w, h, 0, 0, w, h); tCtx.restore();

        const ctx = targetCvs.getContext('2d');
        ctx.save(); ctx.globalCompositeOperation = 'destination-out'; ctx.globalAlpha = 1.0; ctx.beginPath();
        ctx.moveTo(lassoPoints[0].x, lassoPoints[0].y);
        for(let i=1; i<lassoPoints.length; i++) ctx.lineTo(lassoPoints[i].x, lassoPoints[i].y);
        ctx.closePath(); ctx.fill(); ctx.restore();

        updateWorkspace();
        selectionCanvas = tempCvs; selectionX = minX; selectionY = minY; hasSelection = true; selectionAngle = 0;

        document.getElementById('btn-copy').disabled = false;
        document.getElementById('btn-delete').disabled = false;
        setSelectionTransformButtonsDisabled(false);
        drawSelectionFrame();
    }

    function drawSelectionFrame() {
        iCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
        if(!hasSelection || !selectionCanvas) return;
        const w = selectionCanvas.width, h = selectionCanvas.height;
        const { cx, cy } = getSelectionCenter();

        iCtx.save();
        iCtx.translate(cx, cy);
        iCtx.rotate(selectionAngle);
        iCtx.drawImage(selectionCanvas, -w / 2, -h / 2);
        iCtx.strokeStyle = '#2196F3'; iCtx.lineWidth = 1; iCtx.setLineDash([5, 5]);
        iCtx.strokeRect(-w / 2, -h / 2, w, h); iCtx.setLineDash([]);
        // 회전 손잡이 지지선
        iCtx.beginPath(); iCtx.moveTo(0, -h / 2); iCtx.lineTo(0, -h / 2 - ROTATE_HANDLE_OFFSET);
        iCtx.strokeStyle = '#2196F3'; iCtx.lineWidth = 1.5; iCtx.stroke();
        iCtx.restore();

        // 회전 손잡이(원)는 월드 좌표로 그려서 항상 똑바로 보이게
        const handle = getRotateHandlePos();
        iCtx.beginPath(); iCtx.arc(handle.x, handle.y, ROTATE_HANDLE_RADIUS, 0, Math.PI * 2);
        iCtx.fillStyle = '#2196F3'; iCtx.fill();
        iCtx.strokeStyle = '#fff'; iCtx.lineWidth = 2; iCtx.stroke();
    }

    function finalizeSelection() {
        if(!hasSelection || !selectionCanvas) return;
        bakeSelectionRotation();
        const targetCtx = frames[currentFrameIdx][currentLayerIdx].getContext('2d');
        targetCtx.save(); targetCtx.globalCompositeOperation = 'source-over'; targetCtx.globalAlpha = 1.0;
        targetCtx.drawImage(selectionCanvas, selectionX, selectionY); targetCtx.restore();

        hasSelection = false; selectionCanvas = null; selectionAngle = 0; iCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);

        document.getElementById('btn-copy').disabled = true;
        document.getElementById('btn-delete').disabled = true;
        setSelectionTransformButtonsDisabled(true);
        updateWorkspace(); saveHistorySnapshot();
    }

    function deleteSelection() {
        if(!hasSelection) return;
        hasSelection = false; selectionCanvas = null; selectionAngle = 0; iCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
        document.getElementById('btn-copy').disabled = true;
        document.getElementById('btn-delete').disabled = true;
        setSelectionTransformButtonsDisabled(true);
        updateWorkspace(); saveHistorySnapshot();
    }

    function copySelection() {
        if(!hasSelection || !selectionCanvas) return;
        clipboardCanvas = document.createElement('canvas');
        clipboardCanvas.width = selectionCanvas.width; clipboardCanvas.height = selectionCanvas.height;
        clipboardCanvas.getContext('2d').drawImage(selectionCanvas, 0, 0);
        lastCopyOriginX = selectionX; lastCopyOriginY = selectionY; // 원본 좌상단 좌표 기록
        document.getElementById('btn-paste').disabled = false;
        const btn = document.getElementById('btn-copy');
        btn.innerText = '복사됨!'; btn.style.background = '#4CAF50';
        setTimeout(() => { btn.innerText = '복사'; btn.style.background = '#3a3a3a'; }, 1000);
    }

    // ===== 붙여넣기: 중앙이 아니라 원본에서 아래로 살짝 오프셋 =====
    function pasteSelection() {
        if(!clipboardCanvas) return;
        finalizeSelection();
        selectionCanvas = document.createElement('canvas');
        selectionCanvas.width = clipboardCanvas.width; selectionCanvas.height = clipboardCanvas.height;
        selectionCanvas.getContext('2d').drawImage(clipboardCanvas, 0, 0);

        const OFFSET = 30; // 아래로 30px만큼 이동해서 붙여넣기
        let px = lastCopyOriginX + OFFSET * 0.3; // 살짝 오른쪽으로도 이동(겹침 방지)
        let py = lastCopyOriginY + OFFSET;

        // 캔버스 밖으로 나가지 않도록 경계 보정
        px = Math.max(0, Math.min(px, CANVAS_W - selectionCanvas.width));
        py = Math.max(0, Math.min(py, CANVAS_H - selectionCanvas.height));

        selectionX = px; selectionY = py; selectionAngle = 0;
        hasSelection = true; currentMode = 'lasso';
        document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
        document.getElementById('tool-lasso').classList.add('active');
        document.getElementById('btn-copy').disabled = false;
        document.getElementById('btn-delete').disabled = false;
        setSelectionTransformButtonsDisabled(false);
        updateCursorStyle();
        drawSelectionFrame();

        // 다음에 또 붙여넣기 하면 이번 붙여넣은 위치 기준으로 더 내려가도록 갱신
        lastCopyOriginX = selectionX; lastCopyOriginY = selectionY;
    }

        // ===== 선택 영역 변형: 확대/축소/회전/반전 =====
    function setSelectionTransformButtonsDisabled(disabled) {
        ['btn-scale-up', 'btn-scale-down', 'btn-flip-h', 'btn-flip-v'].forEach(id => {
            document.getElementById(id).disabled = disabled;
        });
    }

    // factor: 1보다 크면 확대, 작으면 축소. 중심점을 유지한 채 크기만 변경.
    function scaleSelection(factor) {
        if (!hasSelection || !selectionCanvas) return;
        bakeSelectionRotation();
        const newW = Math.max(5, Math.round(selectionCanvas.width * factor));
        const newH = Math.max(5, Math.round(selectionCanvas.height * factor));
        const centerX = selectionX + selectionCanvas.width / 2;
        const centerY = selectionY + selectionCanvas.height / 2;

        const tempCvs = document.createElement('canvas');
        tempCvs.width = newW; tempCvs.height = newH;
        const tCtx = tempCvs.getContext('2d');
        tCtx.drawImage(selectionCanvas, 0, 0, newW, newH);

        selectionCanvas = tempCvs;
        selectionX = Math.round(centerX - newW / 2);
        selectionY = Math.round(centerY - newH / 2);
        drawSelectionFrame();
    }

    // 자유 회전: 선택 영역 위의 회전 손잡이를 드래그해서 원하는 각도로 회전.
    function getSelectionCenter() {
        return { cx: selectionX + selectionCanvas.width / 2, cy: selectionY + selectionCanvas.height / 2 };
    }

    // 현재 미리보기 각도(selectionAngle)에서의 회전 손잡이 월드 좌표
    function getRotateHandlePos() {
        const { cx, cy } = getSelectionCenter();
        const h = selectionCanvas.height;
        const localX = 0, localY = -(h / 2) - ROTATE_HANDLE_OFFSET;
        const cos = Math.cos(selectionAngle), sin = Math.sin(selectionAngle);
        return { x: cx + (localX * cos - localY * sin), y: cy + (localX * sin + localY * cos) };
    }

    function isPointOnRotateHandle(x, y) {
        if (!hasSelection || !selectionCanvas) return false;
        const p = getRotateHandlePos();
        const dx = x - p.x, dy = y - p.y;
        return Math.sqrt(dx * dx + dy * dy) <= ROTATE_HANDLE_RADIUS + 4;
    }

    // 드래그가 끝나면 미리보기 각도(selectionAngle)를 실제 픽셀에 구워넣고(bake) 각도를 0으로 리셋.
    // 회전된 사각형이 잘리지 않도록 bounding box 크기로 새 캔버스를 만든다.
    function bakeSelectionRotation() {
        if (Math.abs(selectionAngle) < 0.0001) return;
        const w = selectionCanvas.width, h = selectionCanvas.height;
        const { cx, cy } = getSelectionCenter();
        const cos = Math.abs(Math.cos(selectionAngle)), sin = Math.abs(Math.sin(selectionAngle));
        const newW = Math.max(1, Math.round(w * cos + h * sin));
        const newH = Math.max(1, Math.round(w * sin + h * cos));

        const tempCvs = document.createElement('canvas');
        tempCvs.width = newW; tempCvs.height = newH;
        const tCtx = tempCvs.getContext('2d');
        tCtx.translate(newW / 2, newH / 2);
        tCtx.rotate(selectionAngle);
        tCtx.drawImage(selectionCanvas, -w / 2, -h / 2);

        selectionCanvas = tempCvs;
        selectionX = Math.round(cx - newW / 2);
        selectionY = Math.round(cy - newH / 2);
        selectionAngle = 0;
    }

    // axis: 'h'(좌우 반전) 또는 'v'(상하 반전)
    function flipSelection(axis) {
        if (!hasSelection || !selectionCanvas) return;
        bakeSelectionRotation();
        const w = selectionCanvas.width, h = selectionCanvas.height;
        const tempCvs = document.createElement('canvas');
        tempCvs.width = w; tempCvs.height = h;
        const tCtx = tempCvs.getContext('2d');
        tCtx.save();
        if (axis === 'h') { tCtx.translate(w, 0); tCtx.scale(-1, 1); }
        else { tCtx.translate(0, h); tCtx.scale(1, -1); }
        tCtx.drawImage(selectionCanvas, 0, 0);
        tCtx.restore();
        selectionCanvas = tempCvs;
        drawSelectionFrame();
    }

function createEmptyLayerCanvas() { const c = document.createElement('canvas'); c.width = CANVAS_W; c.height = CANVAS_H; return c; }

    // duplicateCurrent: true(전체 복제) / false(빈 프레임) / 숫자(해당 레이어 인덱스만 복제)
    function addFrame(duplicateCurrent = false) {
        finalizeSelection(); let newFrameLayers = [];
        const onlyLayerIdx = (typeof duplicateCurrent === 'number') ? duplicateCurrent : null;
        for(let i=0; i<globalLayers.length; i++) {
            const lc = createEmptyLayerCanvas();
            if (frames.length > 0) {
                if (duplicateCurrent === true) {
                    lc.getContext('2d').drawImage(frames[currentFrameIdx][i], 0, 0);
                } else if (onlyLayerIdx !== null && i === onlyLayerIdx) {
                    lc.getContext('2d').drawImage(frames[currentFrameIdx][i], 0, 0);
                }
            }
            newFrameLayers.push(lc);
        }
        if (frames.length === 0) { frames.push(newFrameLayers); currentFrameIdx = 0; }
        else { frames.splice(currentFrameIdx + 1, 0, newFrameLayers); currentFrameIdx++; }
        clearHistory(); updateWorkspace(); updateTimelineUI(); saveHistorySnapshot();
    }

    function selectFrame(idx) {
        if(idx < 0 || idx >= frames.length) return;
        finalizeSelection(); currentFrameIdx = idx;
        clearHistory(); updateWorkspace(); updateTimelineUI(); saveHistorySnapshot();
    }

    // ===== 프레임 삭제 (확인창 없이 즉시 삭제, 최소 1개는 보호) =====
    function deleteFrame(idx) {
        if (frames.length <= 1) return; // 마지막 1개는 보호
        finalizeSelection();
        frames.splice(idx, 1);
        if (currentFrameIdx >= frames.length) currentFrameIdx = frames.length - 1;
        else if (idx < currentFrameIdx) currentFrameIdx--;
        clearHistory(); updateWorkspace(); updateTimelineUI(); saveHistorySnapshot();
    }

    function updateLayerUI() {
        layerListDiv.innerHTML = '';
        for (let i = globalLayers.length - 1; i >= 0; i--) {
            const layer = globalLayers[i]; const div = document.createElement('div');
            div.className = 'layer-item' + (i === currentLayerIdx ? ' active' : '');
            const visChk = document.createElement('input'); visChk.type = 'checkbox'; visChk.checked = layer.visible;
            visChk.onclick = (e) => { e.stopPropagation(); layer.visible = visChk.checked; updateWorkspace(); };
            const nameInput = document.createElement('input'); nameInput.type = 'text'; nameInput.value = layer.name;
            nameInput.onchange = () => { layer.name = nameInput.value; }; nameInput.onclick = (e) => e.stopPropagation();

            const delBtn = document.createElement('button');
            delBtn.className = 'layer-mini-btn del'; delBtn.innerText = '🗑️'; delBtn.title = '이 레이어 삭제 (모든 프레임에서 삭제)';
            delBtn.disabled = globalLayers.length <= 1;
            delBtn.onclick = (e) => { e.stopPropagation(); deleteLayer(i); };

            div.appendChild(visChk); div.appendChild(nameInput); div.appendChild(delBtn);
            div.onclick = () => { finalizeSelection(); currentLayerIdx = i; updateLayerUI(); updateWorkspace(); };
            layerListDiv.appendChild(div);
        }
    }

    function addLayer() {
        finalizeSelection(); const newLayerIdx = globalLayers.length;
        globalLayers.push({ id: `layer-${newLayerIdx}`, name: `레이어 ${newLayerIdx+1}`, visible: true });
        frames.forEach(frame => frame.push(createEmptyLayerCanvas()));
        currentLayerIdx = newLayerIdx; updateLayerUI(); updateWorkspace(); saveHistorySnapshot();
    }

    // 레이어 삭제: 모든 프레임에서 해당 레이어를 제거. 최소 1개 레이어는 보호.
    function deleteLayer(idx) {
        if (globalLayers.length <= 1) return;
        finalizeSelection();
        globalLayers.splice(idx, 1);
        frames.forEach(frameLayers => frameLayers.splice(idx, 1));
        if (currentLayerIdx >= globalLayers.length) currentLayerIdx = globalLayers.length - 1;
        else if (idx < currentLayerIdx) currentLayerIdx--;
        updateLayerUI(); updateWorkspace(); saveHistorySnapshot();
    }

    function updateWorkspace() {
        layersContainer.innerHTML = '';
        frames[currentFrameIdx].forEach((cvs, idx) => {
            if (globalLayers[idx].visible) { cvs.style.position = 'absolute'; cvs.style.top = '0'; cvs.style.left = '0'; layersContainer.appendChild(cvs); }
        });
        oCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
        if (document.getElementById('chk-onion').checked && currentFrameIdx > 0) {
            frames[currentFrameIdx - 1].forEach((cvs, idx) => { if (globalLayers[idx].visible) { oCtx.save(); oCtx.globalAlpha = 1.0; oCtx.drawImage(cvs, 0, 0); oCtx.restore(); } });
        }
        updateTimelineUI();
    }

    function updateTimelineUI() {
        frameThumbnailsDiv.innerHTML = '';
        frames.forEach((frame, idx) => {
            const thumb = document.createElement('div'); thumb.className = 'frame-thumb' + (idx === currentFrameIdx ? ' active' : '');
            const tc = document.createElement('canvas'); tc.width = 160; tc.height = 90;
            const tctx = tc.getContext('2d'); tctx.fillStyle = '#fff'; tctx.fillRect(0,0,160,90);
            frame.forEach((layerCvs, lIdx) => { if(globalLayers[lIdx].visible) tctx.drawImage(layerCvs, 0, 0, 160, 90); });
            const img = document.createElement('img'); img.src = tc.toDataURL(); thumb.appendChild(img);
            const num = document.createElement('div'); num.className = 'frame-number'; num.innerText = idx + 1; thumb.appendChild(num);

            const delBtn = document.createElement('button');
            delBtn.className = 'frame-del-btn'; delBtn.innerText = '×'; delBtn.title = '이 프레임 삭제';
            delBtn.onclick = (e) => { e.stopPropagation(); deleteFrame(idx); };
            thumb.appendChild(delBtn);

            thumb.onclick = () => selectFrame(idx); frameThumbnailsDiv.appendChild(thumb);
        });
    }

    function saveHistorySnapshot() {
        if(frames.length === 0) return;
        const snapshot = frames[currentFrameIdx].map(cvs => cvs.toDataURL());
        undoStack.push(snapshot); if(undoStack.length > MAX_HISTORY) undoStack.shift();
        redoStack = [];
    }

    function clearHistory() { undoStack = []; redoStack = []; saveHistorySnapshot(); }

    function loadSnapshot(snapshot) {
        if(!snapshot) return; const currentLayers = frames[currentFrameIdx];
        const loadPromises = snapshot.map((dataUrl, i) => {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => { const ctx = currentLayers[i].getContext('2d'); ctx.clearRect(0, 0, CANVAS_W, CANVAS_H); ctx.drawImage(img, 0, 0); resolve(); };
                img.src = dataUrl;
            });
        });
        Promise.all(loadPromises).then(() => updateWorkspace());
    }

    function undo() {
        if(undoStack.length <= 1) return;
        finalizeSelection(); const currentSnapshot = undoStack.pop(); redoStack.push(currentSnapshot);
        loadSnapshot(undoStack[undoStack.length - 1]);
    }

    function redo() {
        if(redoStack.length === 0) return;
        finalizeSelection(); const nextSnapshot = redoStack.pop(); undoStack.push(nextSnapshot);
        loadSnapshot(nextSnapshot);
    }

    function playAnim() {
        if(frames.length <= 1) return;
        finalizeSelection(); isPlaying = true;
        document.getElementById('btn-play').style.display = 'none'; document.getElementById('btn-stop').style.display = 'inline-block';
        oCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
        playInterval = setInterval(() => {
            currentFrameIdx = (currentFrameIdx + 1) % frames.length;
            layersContainer.innerHTML = '';
            frames[currentFrameIdx].forEach((cvs, idx) => {
                if (globalLayers[idx].visible) { cvs.style.position = 'absolute'; cvs.style.top = '0'; cvs.style.left = '0'; layersContainer.appendChild(cvs); }
            });
            document.querySelectorAll('.frame-thumb').forEach((el, i) => { if(i === currentFrameIdx) el.classList.add('active'); else el.classList.remove('active'); });
        }, FRAME_DUR);
    }

    function stopAnim() {
        isPlaying = false; clearInterval(playInterval);
        document.getElementById('btn-play').style.display = 'inline-block'; document.getElementById('btn-stop').style.display = 'none';
        updateWorkspace();
    }

    // ===== 프로젝트 저장 (JSON 파일로 레이어/프레임 전체 상태 저장) =====
    function saveProject() {
        if (frames.length === 0) return alert('저장할 내용이 없습니다.');
        finalizeSelection();
        let fileName = prompt("프로젝트 파일 이름을 입력하세요:", "나의_애니메이션_프로젝트");
        if (!fileName) return;

        const btn = document.getElementById('btn-save-project'); const originalText = btn.innerText;
        btn.innerText = '⏳ 저장 중...'; btn.disabled = true;

        const projectData = {
            type: 'animation-editor-project',
            version: 1,
            canvasW: CANVAS_W,
            canvasH: CANVAS_H,
            layers: globalLayers.map(l => ({ id: l.id, name: l.name, visible: l.visible })),
            currentLayerIdx: currentLayerIdx,
            currentFrameIdx: currentFrameIdx,
            frames: frames.map(frameLayers => frameLayers.map(cvs => cvs.toDataURL('image/png')))
        };

        try {
            const json = JSON.stringify(projectData);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `${fileName}.json`; a.click();
            URL.revokeObjectURL(url);
            alert('💾 프로젝트가 저장되었습니다. 이 파일을 보관해두면 "프로젝트 열기"로 다시 불러와 이어서 작업할 수 있습니다.');
        } catch (err) {
            alert('프로젝트 저장 중 오류가 발생했습니다: ' + err.message);
        } finally {
            btn.innerText = originalText; btn.disabled = false;
        }
    }

    // ===== 프로젝트 불러오기 (파일 선택 → JSON 파싱 → 레이어/프레임 복원) =====
    function handleProjectFileChange(e) {
        const file = e.target.files[0];
        e.target.value = ''; // 같은 파일 재선택 가능하도록 초기화
        if (!file) return;

        if (frames.length > 0 && !confirm('현재 작업 중인 내용은 저장되지 않으면 사라집니다. 프로젝트를 불러오시겠습니까?')) {
            return;
        }

        const reader = new FileReader();
        reader.onload = (ev) => {
            let data;
            try {
                data = JSON.parse(ev.target.result);
            } catch (err) {
                alert('올바른 프로젝트 파일이 아닙니다.');
                return;
            }
            if (!data || data.type !== 'animation-editor-project' || !Array.isArray(data.layers) || !Array.isArray(data.frames)) {
                alert('올바른 프로젝트 파일이 아닙니다.');
                return;
            }
            loadProjectFromData(data);
        };
        reader.onerror = () => alert('파일을 읽는 중 오류가 발생했습니다.');
        reader.readAsText(file);
    }

    function loadProjectFromData(data) {
        const btn = document.getElementById('btn-load-project'); const originalText = btn.innerText;
        btn.innerText = '⏳ 불러오는 중...'; btn.disabled = true;

        finalizeSelection();

        const loadTasks = [];
        const newFrames = data.frames.map(frameLayerUrls => {
            return frameLayerUrls.map(dataUrl => {
                const cvs = createEmptyLayerCanvas();
                const ctx = cvs.getContext('2d');
                const task = new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => { ctx.drawImage(img, 0, 0, CANVAS_W, CANVAS_H); resolve(); };
                    img.onerror = () => resolve(); // 손상된 이미지는 빈 레이어로 둠
                    img.src = dataUrl;
                });
                loadTasks.push(task);
                return cvs;
            });
        });

        Promise.all(loadTasks).then(() => {
            frames = newFrames;
            globalLayers = data.layers.map((l, i) => ({
                id: l.id || `layer-${i}`,
                name: l.name || `레이어 ${i + 1}`,
                visible: l.visible !== false
            }));
            currentFrameIdx = Math.min(Math.max(data.currentFrameIdx || 0, 0), frames.length - 1);
            currentLayerIdx = Math.min(Math.max(data.currentLayerIdx || 0, 0), globalLayers.length - 1);

            clearHistory(); updateLayerUI(); updateWorkspace(); updateTimelineUI(); saveHistorySnapshot();
            btn.innerText = originalText; btn.disabled = false;
            alert('📂 프로젝트를 불러왔습니다.');
        });
    }

    function saveGif() {
        if(frames.length === 0) return alert('저장할 프레임이 없습니다.');
        finalizeSelection();
        let fileName = prompt("저장할 파일 이름을 입력하세요:", "나의_애니메이션");
        if (!fileName) return;
        const btn = document.getElementById('btn-save-gif'); const originalText = btn.innerText;
        btn.innerText = '⏳ 처리 중... 화면을 닫지 마세요'; btn.style.background = '#ff9800'; btn.disabled = true;

        const exportWidth = 854; const exportHeight = 480;
        const images = [];
        const tempCvs = document.createElement('canvas'); tempCvs.width = exportWidth; tempCvs.height = exportHeight;
        const tCtx = tempCvs.getContext('2d');

        for (let playIdx = 0; playIdx < frames.length; playIdx++) {
            tCtx.fillStyle = '#ffffff'; tCtx.fillRect(0, 0, exportWidth, exportHeight);
            globalLayers.forEach((layer, i) => {
                if (layer.visible) tCtx.drawImage(frames[playIdx][i], 0, 0, CANVAS_W, CANVAS_H, 0, 0, exportWidth, exportHeight);
            });
            images.push(tempCvs.toDataURL('image/png'));
        }

        gifshot.createGIF({
            images: images, gifWidth: exportWidth, gifHeight: exportHeight, interval: FRAME_DUR / 1000, numWorkers: 2
        }, function(obj) {
            if(!obj.error) {
                const a = document.createElement('a'); a.href = obj.image; a.download = `${fileName}.gif`; a.click();
                alert("🎉 GIF 애니메이션이 성공적으로 다운로드 되었습니다!");
            } else { alert('GIF 생성 중 오류가 발생했습니다.'); }
            btn.innerText = originalText; btn.style.background = '#E91E63'; btn.disabled = false;
        });
    }

    window.onload = init;

</script>
